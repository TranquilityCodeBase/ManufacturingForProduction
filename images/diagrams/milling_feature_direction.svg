<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-label="Feature directions that a 3-axis mill can and cannot reach">
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2733; font-size: 14px; }
    .good { fill: #1d7a4f; font-weight: 600; }
    .warn { fill: #b0590e; font-weight: 600; }
    .s { font-size: 13px; fill: #4a5868; }
    .part { fill: #cfd8e3; stroke: #34495e; stroke-width: 2; }
    .hole { fill: #ffffff; stroke: #34495e; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d7a4f"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b0590e"/>
    </marker>
  </defs>

  <rect x="100" y="80" width="420" height="170" class="part"/>

  <!-- Vertical hole from the top: OK -->
  <rect x="160" y="80" width="24" height="90" class="hole"/>
  <line x1="172" y1="30" x2="172" y2="74" stroke="#1d7a4f" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="172" y="22" text-anchor="middle" class="good">Top face: OK</text>

  <!-- Angled hole: needs 3+2 / 5-axis -->
  <rect x="288" y="80" width="24" height="100" class="hole" transform="rotate(35 300 80)"/>
  <line x1="342" y1="20" x2="305" y2="73" stroke="#b0590e" stroke-width="2.5" marker-end="url(#arrO)"/>
  <text x="352" y="22" class="warn">Angled: 3+2 or 5-axis</text>

  <!-- Side hole: OK with a side setup -->
  <rect x="430" y="150" width="90" height="24" class="hole"/>
  <line x1="610" y1="162" x2="527" y2="162" stroke="#1d7a4f" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="535" y="140" class="good">Side setup: OK*</text>

  <text x="330" y="285" text-anchor="middle">Features parallel or perpendicular to the block faces suit 3-axis milling.</text>
  <text x="330" y="307" text-anchor="middle" class="s">*Each new face the tool must reach is another setup (part rotation).</text>
</svg>
