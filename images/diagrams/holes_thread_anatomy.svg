<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="Internal thread in section showing major diameter, minor diameter equal to the tap drill, pitch and thread depth, and a comparison of 75 percent and 50 to 60 percent thread engagement">
<title>Internal thread in section showing major diameter, minor diameter equal to the tap drill, pitch and thread depth, and a comparison of 75 percent and 50 to 60 percent thread engagement</title>
<style>
