<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="Segoe UI, Arial, sans-serif">
  <title>Horizontal hole shapes: round, teardrop, diamond</title>
  <!-- Build direction arrow -->
  <line x1="20" y1="200" x2="20" y2="70" stroke="#1f6fb2" stroke-width="2"/>
  <polygon points="20,60 14,74 26,74" fill="#1f6fb2"/>
  <text x="4" y="220" font-size="12" fill="#1f6fb2">build</text>

  <!-- Block 1: round hole, ceiling sags -->
  <rect x="50" y="50" width="160" height="160" fill="#cfd8e3" stroke="#34495e" stroke-width="2"/>
  <circle cx="130" cy="130" r="45" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <path d="M100,96 Q130,116 160,96" fill="none" stroke="#b3261e" stroke-width="3"/>
  <path d="M112,106 l-3,10 M130,110 l0,12 M148,106 l3,10" stroke="#b3261e" stroke-width="2"/>
  <text x="130" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#b3261e">Round</text>
  <text x="130" y="256" text-anchor="middle" font-size="13" fill="#1c2733">flat-ish ceiling sags</text>

  <!-- Block 2: teardrop hole -->
  <rect x="280" y="50" width="160" height="160" fill="#cfd8e3" stroke="#34495e" stroke-width="2"/>
  <path d="M328.2,113.2 L360,81.4 L391.8,113.2 A45,45 0 1 1 328.2,113.2 Z" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <path d="M360,81.4 L391.8,113.2" stroke="#1d7a4f" stroke-width="3"/>
  <path d="M360,81.4 L328.2,113.2" stroke="#1d7a4f" stroke-width="3"/>
  <text x="400" y="96" font-size="13" font-weight="700" fill="#1f6fb2">45°</text>
  <text x="360" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#1d7a4f">Teardrop</text>
  <text x="360" y="256" text-anchor="middle" font-size="13" fill="#1c2733">self-supporting point</text>

  <!-- Block 3: diamond hole -->
  <rect x="510" y="50" width="160" height="160" fill="#cfd8e3" stroke="#34495e" stroke-width="2"/>
  <polygon points="590,82 638,130 590,178 542,130" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <path d="M542,130 L590,82 L638,130" fill="none" stroke="#1d7a4f" stroke-width="3"/>
  <text x="590" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#1d7a4f">Diamond</text>
  <text x="590" y="256" text-anchor="middle" font-size="13" fill="#1c2733">good for metal channels</text>
</svg>
