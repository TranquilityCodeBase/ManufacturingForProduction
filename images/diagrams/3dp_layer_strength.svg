<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="FDM print orientation and bending strength of a bar">
<title>FDM print orientation and bending strength of a bar</title>
<style>
  text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2733; font-size: 14px; }
  .h { font-size: 16px; font-weight: 700; }
  .s { font-size: 13px; fill: #4a5868; }
  .lbl { fill: #1f6fb2; font-weight: 600; }
  .good { fill: #1d7a4f; font-weight: 600; }
  .warn { fill: #b0590e; font-weight: 600; }
  .bad { fill: #b3261e; font-weight: 600; }
  .muted { fill: #6b7a8c; font-size: 13px; letter-spacing: 2px; }
  .part { fill: #cfd8e3; stroke: #34495e; stroke-width: 2; }
  .part2 { fill: #9fb4c9; stroke: #34495e; stroke-width: 2; }
  .tool { fill: #f3b562; stroke: #b9772c; stroke-width: 2; }
  .flute { stroke: #b9772c; stroke-width: 1.5; }
  .holder { fill: #9aa7b4; stroke: #5d6b79; stroke-width: 2; }
  .dim { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .lead { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .sep { stroke: #d6dde6; stroke-width: 2; }
  .air { fill: #ffffff; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs>
  <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1d7a4f"/>
  </marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#b3261e"/>
  </marker>
</defs>

<rect x="20" y="230" width="320" height="10" fill="#8a97a6"/>
<rect x="380" y="230" width="320" height="10" fill="#8a97a6"/>
<text x="180" y="30" text-anchor="middle" class="h" style="fill:#1d7a4f">Printed flat - strong</text>
<rect x="40" y="166" width="280" height="64" class="part"/>
<g stroke="#34495e" stroke-width="1" opacity="0.55"><line x1="40" y1="178" x2="320" y2="178"/><line x1="40" y1="190" x2="320" y2="190"/><line x1="40" y1="202" x2="320" y2="202"/><line x1="40" y1="214" x2="320" y2="214"/><line x1="40" y1="226" x2="320" y2="226"/></g>
<line x1="300" y1="92" x2="300" y2="150" stroke="#1f6fb2" stroke-width="3"/><polygon points="300,162 293,148 307,148" fill="#1f6fb2"/>
<text x="290" y="100" text-anchor="end" class="lbl">bending load in use</text>
<text x="180" y="266" text-anchor="middle">Bending stress runs along the layers</text>
<text x="540" y="30" text-anchor="middle" class="h" style="fill:#b3261e">Printed upright - weak</text>
<rect x="520" y="50" width="40" height="180" class="part"/>
<g stroke="#34495e" stroke-width="1" opacity="0.55"><line x1="520" y1="62" x2="560" y2="62"/><line x1="520" y1="74" x2="560" y2="74"/><line x1="520" y1="86" x2="560" y2="86"/><line x1="520" y1="98" x2="560" y2="98"/><line x1="520" y1="110" x2="560" y2="110"/><line x1="520" y1="122" x2="560" y2="122"/><line x1="520" y1="134" x2="560" y2="134"/><line x1="520" y1="146" x2="560" y2="146"/><line x1="520" y1="158" x2="560" y2="158"/><line x1="520" y1="170" x2="560" y2="170"/><line x1="520" y1="182" x2="560" y2="182"/><line x1="520" y1="194" x2="560" y2="194"/><line x1="520" y1="206" x2="560" y2="206"/><line x1="520" y1="218" x2="560" y2="218"/></g>
<line x1="440" y1="64" x2="506" y2="64" stroke="#1f6fb2" stroke-width="3"/><polygon points="518,64 504,57 504,71" fill="#1f6fb2"/>
<text x="436" y="54" text-anchor="start" class="lbl">same load</text>
<path d="M518,212 L528,209 L536,214 L546,208 L554,213 L562,210" fill="none" stroke="#b3261e" stroke-width="3"/>
<text x="570" y="214" text-anchor="start" class="bad">splits here</text>
<text x="540" y="266" text-anchor="middle">Layers pull apart: often 30-60% weaker in Z</text>
<text x="360" y="292" text-anchor="middle" class="s">Thin lines show printed layers. Orient so the main load does not peel layers apart.</text>
</svg>
