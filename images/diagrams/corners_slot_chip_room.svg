<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img" aria-label="Top view of a slot exactly one cutter wide with chips trapped, versus a slot about 1.2 to 1.5 times the cutter where chips clear and each wall gets a finishing pass">
<title>Top view of a slot exactly one cutter wide with chips trapped, versus a slot about 1.2 to 1.5 times the cutter where chips clear and each wall gets a finishing pass</title>
<style>
  text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2733; font-size: 14px; }
  .h { font-size: 16px; font-weight: 700; }
  .s { font-size: 13px; fill: #4a5868; }
  .lbl { fill: #1f6fb2; font-weight: 600; }
  .good { fill: #1d7a4f; font-weight: 600; }
  .warn { fill: #b0590e; font-weight: 600; }
  .bad { fill: #b3261e; font-weight: 600; }
  .muted { fill: #6b7a8c; font-size: 13px; letter-spacing: 2px; }
  .part { fill: #cfd8e3; stroke: #34495e; stroke-width: 2; }
  .part2 { fill: #9fb4c9; stroke: #34495e; stroke-width: 2; }
  .tool { fill: #f3b562; stroke: #b9772c; stroke-width: 2; }
  .flute { stroke: #b9772c; stroke-width: 1.5; }
  .holder { fill: #9aa7b4; stroke: #5d6b79; stroke-width: 2; }
  .dim { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .lead { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .sep { stroke: #d6dde6; stroke-width: 2; }
  .air { fill: #ffffff; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs>
  <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1d7a4f"/>
  </marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#b3261e"/>
  </marker>
</defs>

<line x1="450" y1="15" x2="450" y2="305" class="sep"/>
<g transform="translate(0,0)">
<text x="225" y="32" text-anchor="middle" class="h">Slot = cutter diameter</text>
<rect x="40" y="60" width="370" height="180" class="part"/>
<rect x="40" y="120.0" width="300" height="60" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
<path d="M340 120.0 A30.0 30.0 0 0 1 340 180.0" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
<rect x="320" y="121.0" width="22" height="58" fill="#ffffff"/>
<circle cx="340" cy="150" r="30" class="tool"/>
<circle cx="340" cy="150" r="4" fill="#b9772c"/>
<path d="M300 132 q5 -7 10 0" fill="#f3b562" stroke="#b9772c" stroke-width="1"/>
<path d="M292 160 q5 -7 10 0" fill="#f3b562" stroke="#b9772c" stroke-width="1"/>
<path d="M312 168 q5 -7 10 0" fill="#f3b562" stroke="#b9772c" stroke-width="1"/>
<path d="M282 140 q5 -7 10 0" fill="#f3b562" stroke="#b9772c" stroke-width="1"/>
<path d="M306 150 q5 -7 10 0" fill="#f3b562" stroke="#b9772c" stroke-width="1"/>
<line x1="290" y1="150" x2="240" y2="200" stroke="#b3261e" stroke-width="1.5"/>
<text x="236" y="214" text-anchor="end" class="bad">chips packed</text>
<text x="225" y="268" text-anchor="middle" class="bad">Full slotting: tool engaged 180 degrees,</text>
<text x="225" y="290" text-anchor="middle">chips trapped, rough walls, slow feed</text>
</g>
<g transform="translate(450,0)">
<text x="225" y="32" text-anchor="middle" class="h">Slot about 1.2-1.5 x cutter</text>
<rect x="40" y="60" width="370" height="180" class="part"/>
<rect x="40" y="108.0" width="300" height="84" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
<path d="M340 108.0 A42.0 42.0 0 0 1 340 192.0" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
<rect x="320" y="109.0" width="22" height="82" fill="#ffffff"/>
<circle cx="344" cy="138.0" r="30" class="tool"/>
<circle cx="344" cy="138.0" r="4" fill="#b9772c"/>
<path d="M270 176 q5 -7 10 0" fill="#f3b562" stroke="#b9772c" stroke-width="1"/>
<path d="M240 180 q5 -7 10 0" fill="#f3b562" stroke="#b9772c" stroke-width="1"/>
<path d="M210 174 q5 -7 10 0" fill="#f3b562" stroke="#b9772c" stroke-width="1"/>
<path d="M180 178 q5 -7 10 0" fill="#f3b562" stroke="#b9772c" stroke-width="1"/>
<line x1="300" y1="178" x2="160" y2="178" stroke="#1d7a4f" stroke-width="2" marker-end="url(#ag)"/>
<text x="150" y="207" text-anchor="start" class="good">chips escape</text>
<line x1="60" y1="114.0" x2="330" y2="114.0" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="60" y1="186.0" x2="330" y2="186.0" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="100.0" text-anchor="start" class="lbl" style="font-size:13px">finish pass each wall</text>
<text x="225" y="268" text-anchor="middle" class="good">Chips clear past the tool;</text>
<text x="225" y="290" text-anchor="middle">a light finishing pass on each wall</text>
</g>
</svg>
