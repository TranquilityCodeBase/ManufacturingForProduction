<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="On-axis, axial and radial holes on a turned part">
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2733; font-size: 14px; }
    .h { font-size: 16px; font-weight: 700; }
    .dimt { fill: #1f6fb2; font-weight: 600; }
    .part { fill: #cfd8e3; stroke: #34495e; stroke-width: 2; }
    .end { fill: #b8c4d2; stroke: #34495e; stroke-width: 2; }
    .hole { fill: #ffffff; stroke: #34495e; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .holeface { fill: #34495e; }
    .axis { stroke: #1f6fb2; stroke-width: 1.5; stroke-dasharray: 10 4 2 4; }
  </style>

  <line x1="300" y1="15" x2="300" y2="285" stroke="#d6dde6" stroke-width="2"/>
  <line x1="600" y1="15" x2="600" y2="285" stroke="#d6dde6" stroke-width="2"/>

  <!-- On-axis -->
  <text x="150" y="30" text-anchor="middle" class="h">On-axis</text>
  <rect x="40" y="100" width="190" height="90" class="part"/>
  <ellipse cx="230" cy="145" rx="16" ry="45" class="end"/>
  <line x1="25" y1="145" x2="270" y2="145" class="axis"/>
  <rect x="140" y="136" width="90" height="18" class="hole"/>
  <ellipse cx="230" cy="145" rx="4" ry="9" class="holeface"/>
  <text x="150" y="235" text-anchor="middle">On the centerline, from the end</text>
  <text x="150" y="257" text-anchor="middle" class="dimt">Min 0.040 in (1 mm), depth up to 6 x D</text>

  <!-- Axial -->
  <g transform="translate(300,0)">
    <text x="150" y="30" text-anchor="middle" class="h">Axial (off-center)</text>
    <rect x="40" y="100" width="190" height="90" class="part"/>
    <ellipse cx="230" cy="145" rx="16" ry="45" class="end"/>
    <line x1="25" y1="145" x2="270" y2="145" class="axis"/>
    <rect x="150" y="111" width="80" height="16" class="hole"/>
    <ellipse cx="230" cy="119" rx="4" ry="8" class="holeface"/>
    <text x="150" y="235" text-anchor="middle">Parallel to the axis, offset (live tool)</text>
    <text x="150" y="257" text-anchor="middle" class="dimt">Min 0.040 in (1 mm)</text>
  </g>

  <!-- Radial -->
  <g transform="translate(600,0)">
    <text x="150" y="30" text-anchor="middle" class="h">Radial (cross hole)</text>
    <rect x="40" y="100" width="190" height="90" class="part"/>
    <ellipse cx="230" cy="145" rx="16" ry="45" class="end"/>
    <line x1="25" y1="145" x2="270" y2="145" class="axis"/>
    <rect x="122" y="100" width="20" height="90" class="hole"/>
    <ellipse cx="132" cy="100" rx="10" ry="4" class="holeface"/>
    <line x1="132" y1="60" x2="132" y2="92" stroke="#1f6fb2" stroke-width="2"/>
    <text x="150" y="235" text-anchor="middle">Through the side, square to the axis</text>
    <text x="150" y="257" text-anchor="middle" class="dimt">Min 0.080 in (2 mm)</text>
  </g>
</svg>
