<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="How FDM, industrial top-down SLA, SLS or MJF, and DMLS build parts">
<title>How FDM, industrial top-down SLA, SLS or MJF, and DMLS build parts</title>
<style>
  text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2733; font-size: 14px; }
  .h { font-size: 16px; font-weight: 700; }
  .s { font-size: 13px; fill: #4a5868; }
  .lbl { fill: #1f6fb2; font-weight: 600; }
  .good { fill: #1d7a4f; font-weight: 600; }
  .warn { fill: #b0590e; font-weight: 600; }
  .bad { fill: #b3261e; font-weight: 600; }
  .muted { fill: #6b7a8c; font-size: 13px; letter-spacing: 2px; }
  .part { fill: #cfd8e3; stroke: #34495e; stroke-width: 2; }
  .part2 { fill: #9fb4c9; stroke: #34495e; stroke-width: 2; }
  .tool { fill: #f3b562; stroke: #b9772c; stroke-width: 2; }
  .flute { stroke: #b9772c; stroke-width: 1.5; }
  .holder { fill: #9aa7b4; stroke: #5d6b79; stroke-width: 2; }
  .dim { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .lead { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .sep { stroke: #d6dde6; stroke-width: 2; }
  .air { fill: #ffffff; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs>
  <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1d7a4f"/>
  </marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#b3261e"/>
  </marker>
</defs>

<g fill="none" stroke="#d6dde6" stroke-width="1.5"><rect x="5" y="5" width="210" height="290" rx="8"/><rect x="225" y="5" width="210" height="290" rx="8"/><rect x="445" y="5" width="210" height="290" rx="8"/><rect x="665" y="5" width="210" height="290" rx="8"/></g>
<text x="110" y="32" text-anchor="middle" class="h">FDM / FFF</text>
<line x1="110" y1="44" x2="110" y2="74" stroke="#7a5c2e" stroke-width="3"/><polygon points="90,74 130,74 122,104 98,104" fill="#8a97a6" stroke="#34495e" stroke-width="2"/><polygon points="104,104 116,104 110,116" fill="#34495e"/>
<g fill="#cfd8e3" stroke="#34495e" stroke-width="1.5"><rect x="55" y="196" width="110" height="12" rx="6"/><rect x="55" y="184" width="110" height="12" rx="6"/><rect x="55" y="172" width="110" height="12" rx="6"/><rect x="55" y="160" width="66" height="12" rx="6"/></g>
<line x1="110" y1="116" x2="110" y2="160" stroke="#b9772c" stroke-width="3"/><rect x="30" y="208" width="160" height="10" fill="#8a97a6"/>
<text x="110" y="248" text-anchor="middle">Melted filament extruded</text>
<text x="110" y="268" text-anchor="middle">bead by bead, layer by layer</text>
<g transform="translate(220,0)"><text x="110" y="28" text-anchor="middle" class="h">SLA</text>
<text x="110" y="46" text-anchor="middle" class="s">industrial, top-down</text>
<rect x="96" y="56" width="28" height="16" rx="3" fill="#34495e"/><line x1="110" y1="72" x2="110" y2="114" stroke="#b3261e" stroke-width="2.5"/><text x="118" y="94" font-size="13" style="fill:#b3261e">UV laser</text><path d="M40,104 L40,214 L180,214 L180,104" fill="none" stroke="#34495e" stroke-width="2"/><rect x="42" y="114" width="136" height="98" fill="#f6e7b0" opacity="0.9"/><line x1="42" y1="114" x2="178" y2="114" stroke="#c9a83a" stroke-width="1.5"/><rect x="52" y="108" width="22" height="6" fill="#8a97a6" stroke="#34495e" stroke-width="1"/><rect x="80" y="118" width="60" height="58" fill="#cfd8e3" stroke="#34495e" stroke-width="1.5"/><rect x="62" y="176" width="100" height="7" fill="#8a97a6" stroke="#34495e" stroke-width="1"/><line x1="160" y1="88" x2="160" y2="176" stroke="#5d6b79" stroke-width="3"/><line x1="170" y1="132" x2="170" y2="160" class="lead" marker-end="url(#a)"/><text x="196" y="150" font-size="12" text-anchor="middle" style="fill:#1f6fb2">lowers</text><text x="110" y="248" text-anchor="middle">Laser cures the resin surface;</text>
<text x="110" y="268" text-anchor="middle">platform lowers each layer</text>
</g>
<g transform="translate(440,0)"><text x="110" y="32" text-anchor="middle" class="h">SLS / MJF</text>
<line x1="110" y1="46" x2="110" y2="104" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="6 4"/><text x="118" y="64" font-size="13" style="fill:#b3261e">laser / heat</text><rect x="35" y="110" width="150" height="96" fill="#e8dcc4" stroke="#34495e" stroke-width="1.5"/><rect x="80" y="136" width="60" height="50" fill="#cfd8e3" stroke="#34495e" stroke-width="1.5"/><circle cx="58" cy="102" r="8" fill="#8a97a6" stroke="#34495e" stroke-width="1.5"/><text x="44" y="86" font-size="13">roller</text><text x="110" y="248" text-anchor="middle">Powder fused layer by layer;</text>
<text x="110" y="268" text-anchor="middle">loose powder is the support</text>
</g>
<g transform="translate(660,0)"><text x="110" y="32" text-anchor="middle" class="h">DMLS / metal PBF</text>
<line x1="110" y1="46" x2="110" y2="112" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="6 4"/><text x="118" y="64" font-size="13" style="fill:#b3261e">laser</text><rect x="35" y="110" width="150" height="88" fill="#d9d9d9" stroke="#34495e" stroke-width="1.5"/><polygon points="65,130 155,130 155,150 112,150 112,176 92,176 92,150 65,150" fill="#cfd8e3" stroke="#34495e" stroke-width="1.5"/><g stroke="#b9772c" stroke-width="2"><line x1="71" y1="152" x2="71" y2="198"/><line x1="80" y1="152" x2="80" y2="198"/><line x1="124" y1="152" x2="124" y2="198"/><line x1="136" y1="152" x2="136" y2="198"/><line x1="148" y1="152" x2="148" y2="198"/></g><rect x="30" y="198" width="160" height="10" fill="#8a97a6"/><text x="110" y="248" text-anchor="middle">Metal powder welded to a</text>
<text x="110" y="268" text-anchor="middle">plate; supports anchor heat</text>
</g>
</svg>
