<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="3-axis, 3+2 indexed and continuous 5-axis milling compared">
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2733; font-size: 14px; }
    .h { font-size: 17px; font-weight: 700; }
    .s { font-size: 13px; fill: #4a5868; }
    .dim { fill: #1f6fb2; font-weight: 600; }
    .part { fill: #cfd8e3; stroke: #34495e; stroke-width: 2; }
    .tool { fill: #f3b562; stroke: #b9772c; stroke-width: 2; }
    .holder { fill: #9aa7b4; stroke: #5d6b79; stroke-width: 2; }
    .ax { stroke: #1f6fb2; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6fb2"/>
    </marker>
  </defs>

  <!-- Panel dividers -->
  <line x1="300" y1="15" x2="300" y2="325" stroke="#d6dde6" stroke-width="2"/>
  <line x1="600" y1="15" x2="600" y2="325" stroke="#d6dde6" stroke-width="2"/>

  <!-- ===== Panel 1: 3-axis ===== -->
  <text x="150" y="32" text-anchor="middle" class="h">3-Axis</text>
  <rect x="125" y="55" width="50" height="35" class="holder"/>
  <rect x="140" y="90" width="20" height="125" class="tool"/>
  <path d="M50 190 H125 V215 H175 V190 H250 V270 H50 Z" class="part"/>
  <!-- axis triad -->
  <line x1="40" y1="160" x2="40" y2="112" class="ax" marker-end="url(#arrB)"/>
  <line x1="40" y1="160" x2="88" y2="160" class="ax" marker-end="url(#arrB)"/>
  <line x1="40" y1="160" x2="66" y2="138" class="ax" marker-end="url(#arrB)"/>
  <text x="34" y="106" class="dim" text-anchor="middle">Z</text>
  <text x="96" y="165" class="dim">X</text>
  <text x="70" y="134" class="dim">Y</text>
  <text x="150" y="300" text-anchor="middle">Tool axis stays vertical</text>
  <text x="150" y="320" text-anchor="middle" class="dim">Cost: baseline</text>

  <!-- ===== Panel 2: 3+2 indexed ===== -->
  <g transform="translate(300,0)">
    <text x="150" y="32" text-anchor="middle" class="h">3+2 (Indexed 5-Axis)</text>
    <rect x="135" y="250" width="40" height="34" class="holder"/>
    <g transform="rotate(-25 150 225)">
      <rect x="70" y="200" width="160" height="50" class="part"/>
      <rect x="152" y="200" width="16" height="30" fill="#ffffff" stroke="#34495e" stroke-width="1.5" transform="rotate(25 160 200)"/>
    </g>
    <rect x="124.5" y="55" width="48" height="35" class="holder"/>
    <rect x="140.5" y="90" width="16" height="122" class="tool"/>
    <path d="M232 120 A70 70 0 0 1 252 175" class="ax" marker-end="url(#arrB)"/>
    <text x="238" y="112" class="dim">index</text>
    <text x="150" y="300" text-anchor="middle">Part tilts, locks, then 3-axis cut</text>
    <text x="150" y="320" text-anchor="middle" class="dim">Cost: about +25%</text>
  </g>

  <!-- ===== Panel 3: continuous 5-axis ===== -->
  <g transform="translate(600,0)">
    <text x="150" y="32" text-anchor="middle" class="h">Continuous 5-Axis</text>
    <path d="M40 270 L40 200 Q150 120 260 200 L260 270 Z" class="part"/>
    <!-- ghost tool position -->
    <g transform="translate(194,166) rotate(16.3)" opacity="0.35">
      <rect x="-20" y="-100" width="40" height="30" class="holder" stroke-dasharray="5 4"/>
      <path d="M-9 -70 V-9 A9 9 0 0 0 9 -9 V-70 Z" class="tool" stroke-dasharray="5 4"/>
    </g>
    <!-- active tool position -->
    <g transform="translate(106,166) rotate(-16.3)">
      <rect x="-20" y="-100" width="40" height="30" class="holder"/>
      <path d="M-9 -70 V-9 A9 9 0 0 0 9 -9 V-70 Z" class="tool"/>
    </g>
    <path d="M110 72 Q150 54 190 72" class="ax" marker-start="url(#arrB)" marker-end="url(#arrB)"/>
    <text x="150" y="300" text-anchor="middle">Tool tilts while it cuts</text>
    <text x="150" y="320" text-anchor="middle" class="dim">Cost: about +60%</text>
  </g>
</svg>
