<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Finished square part inside a raw stock blank with clean-up allowance on every face, and plate skimmed on both faces">
<title>Finished square part inside a raw stock blank with clean-up allowance on every face, and plate skimmed on both faces</title>
<style>
  text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2733; font-size: 14px; }
  .h { font-size: 16px; font-weight: 700; }
  .s { font-size: 13px; fill: #4a5868; }
  .lbl { fill: #1f6fb2; font-weight: 600; }
  .good { fill: #1d7a4f; font-weight: 600; }
  .warn { fill: #b0590e; font-weight: 600; }
  .bad { fill: #b3261e; font-weight: 600; }
  .muted { fill: #6b7a8c; font-size: 13px; letter-spacing: 2px; }
  .part { fill: #cfd8e3; stroke: #34495e; stroke-width: 2; }
  .part2 { fill: #9fb4c9; stroke: #34495e; stroke-width: 2; }
  .tool { fill: #f3b562; stroke: #b9772c; stroke-width: 2; }
  .flute { stroke: #b9772c; stroke-width: 1.5; }
  .holder { fill: #9aa7b4; stroke: #5d6b79; stroke-width: 2; }
  .dim { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .lead { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .sep { stroke: #d6dde6; stroke-width: 2; }
  .air { fill: #ffffff; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs>
  <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1d7a4f"/>
  </marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#b3261e"/>
  </marker>
</defs>

<line x1="520" y1="15" x2="520" y2="315" class="sep"/>
<style>.stock { fill: #f4e9da; stroke: #8a6d45; stroke-width: 2; stroke-dasharray: 8 5; }</style>
<text x="260" y="30" text-anchor="middle" class="h">Plan view: blank vs finished part</text>
<rect x="168" y="52" width="204" height="204" class="stock"/>
<rect x="180" y="64" width="180" height="180" class="part"/>
<text x="270" y="150" text-anchor="middle">Finished part</text>
<text x="270" y="170" text-anchor="middle">1.000 x 1.000 in</text>
<line x1="174" y1="110" x2="120" y2="110" class="lead" marker-start="url(#a)"/>
<text x="114" y="106" text-anchor="end" class="lbl">0.06 in</text>
<text x="114" y="124" text-anchor="end" class="lbl">per side</text>
<line x1="168" y1="276" x2="372" y2="276" class="dim" marker-start="url(#d)" marker-end="url(#d)"/>
<text x="270" y="300" text-anchor="middle" class="lbl">Blank about 1.125 in square (part + 1/8 in)</text>
<g transform="translate(520,0)">
<text x="190" y="30" text-anchor="middle" class="h">Plate thickness</text>
<rect x="40" y="90" width="300" height="70" class="stock"/>
<rect x="40" y="97" width="300" height="56" class="part"/>
<text x="190" y="130" text-anchor="middle">Finished 0.950 in</text>
<text x="190" y="82" text-anchor="middle" class="s">skim top</text>
<text x="190" y="178" text-anchor="middle" class="s">skim bottom</text>
<text x="190" y="225" text-anchor="middle" class="lbl">Buy 1.000 in plate</text>
<text x="190" y="250" text-anchor="middle">Finished thickness a little under nominal</text>
<text x="190" y="270" text-anchor="middle">lets both faces be cleaned up flat.</text>
</g>
</svg>
