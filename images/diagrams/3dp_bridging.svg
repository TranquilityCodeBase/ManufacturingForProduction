<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="Segoe UI, Arial, sans-serif">
  <title>Bridging: short bridges print clean, long bridges sag</title>
  <!-- Build plate -->
  <rect x="10" y="220" width="700" height="10" fill="#8a97a6"/>

  <!-- Left: short bridge -->
  <text x="160" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1d7a4f">Short bridge - OK</text>
  <rect x="60" y="100" width="50" height="120" fill="#cfd8e3" stroke="#34495e" stroke-width="2"/>
  <rect x="210" y="100" width="50" height="120" fill="#cfd8e3" stroke="#34495e" stroke-width="2"/>
  <rect x="110" y="100" width="100" height="16" fill="#cfd8e3" stroke="#34495e" stroke-width="2"/>
  <line x1="110" y1="76" x2="210" y2="76" stroke="#1f6fb2" stroke-width="2"/>
  <line x1="110" y1="68" x2="110" y2="84" stroke="#1f6fb2" stroke-width="2"/>
  <line x1="210" y1="68" x2="210" y2="84" stroke="#1f6fb2" stroke-width="2"/>
  <text x="160" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6fb2">5-10 mm (0.2-0.4 in)</text>
  <text x="160" y="250" text-anchor="middle" font-size="13" fill="#1c2733">Filament spans the gap and stays flat</text>

  <!-- Right: long bridge that sags -->
  <text x="545" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#b3261e">Long bridge - sags</text>
  <rect x="410" y="100" width="50" height="120" fill="#cfd8e3" stroke="#34495e" stroke-width="2"/>
  <rect x="630" y="100" width="50" height="120" fill="#cfd8e3" stroke="#34495e" stroke-width="2"/>
  <path d="M460,100 Q545,140 630,100 L630,116 Q545,158 460,116 Z" fill="#cfd8e3" stroke="#b3261e" stroke-width="2"/>
  <line x1="460" y1="76" x2="630" y2="76" stroke="#1f6fb2" stroke-width="2"/>
  <line x1="460" y1="68" x2="460" y2="84" stroke="#1f6fb2" stroke-width="2"/>
  <line x1="630" y1="68" x2="630" y2="84" stroke="#1f6fb2" stroke-width="2"/>
  <text x="545" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6fb2">over ~20 mm (0.8 in)</text>
  <text x="545" y="250" text-anchor="middle" font-size="13" fill="#1c2733">Add support, an arch, or a 45° chamfered ceiling</text>
</svg>
