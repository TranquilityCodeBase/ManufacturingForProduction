<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Sections of a coil insert in an STI tapped hole, a key-locking insert with keys and counterbore, and a heat-set insert pressed into a plastic boss, with the hole to model for each">
<title>Sections of a coil insert in an STI tapped hole, a key-locking insert with keys and counterbore, and a heat-set insert pressed into a plastic boss, with the hole to model for each</title>
<style>
