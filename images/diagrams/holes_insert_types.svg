<text x="150" y="288" text-anchor="middle">(larger than the standard pilot)</text>
<text x="150" y="306" text-anchor="middle" class="s">Wire coil gives a steel thread</text>
<text x="150" y="324" text-anchor="middle" class="s">for the original screw size</text>
