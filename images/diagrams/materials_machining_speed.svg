<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 298" width="900" height="298" role="img" aria-label="Approximate relative machining speed: plastics and brass fastest, aluminum about 4 times carbon steel, stainless about half, titanium about a third">
<title>Approximate relative machining speed: plastics and brass fastest, aluminum about 4 times carbon steel, stainless about half, titanium about a third</title>
<style>
  text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2733; font-size: 14px; }
  .h { font-size: 16px; font-weight: 700; }
  .s { font-size: 13px; fill: #4a5868; }
  .lbl { fill: #1f6fb2; font-weight: 600; }
  .good { fill: #1d7a4f; font-weight: 600; }
  .warn { fill: #b0590e; font-weight: 600; }
  .bad { fill: #b3261e; font-weight: 600; }
  .muted { fill: #6b7a8c; font-size: 13px; letter-spacing: 2px; }
  .part { fill: #cfd8e3; stroke: #34495e; stroke-width: 2; }
  .part2 { fill: #9fb4c9; stroke: #34495e; stroke-width: 2; }
  .tool { fill: #f3b562; stroke: #b9772c; stroke-width: 2; }
  .flute { stroke: #b9772c; stroke-width: 1.5; }
  .holder { fill: #9aa7b4; stroke: #5d6b79; stroke-width: 2; }
  .dim { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .lead { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .sep { stroke: #d6dde6; stroke-width: 2; }
  .air { fill: #ffffff; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs>
  <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1d7a4f"/>
  </marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#b3261e"/>
  </marker>
</defs>

<text x="230" y="51" text-anchor="end" style="font-size:15px">Plastics (acetal, ABS)</text>
<rect x="240" y="34" width="440" height="24" fill="#1d7a4f"/>
<text x="690.0" y="51" text-anchor="start" style="font-size:15px;font-weight:600">very fast, heat limited</text>
<text x="230" y="89" text-anchor="end" style="font-size:15px">Brass C360</text>
<rect x="240" y="72" width="396" height="24" fill="#1d7a4f"/>
<text x="646.0" y="89" text-anchor="start" style="font-size:15px;font-weight:600">about 4-5x</text>
<text x="230" y="127" text-anchor="end" style="font-size:15px">Aluminum 6061</text>
<rect x="240" y="110" width="352" height="24" fill="#1d7a4f"/>
<text x="602.0" y="127" text-anchor="start" style="font-size:15px;font-weight:600">about 4x</text>
<text x="230" y="165" text-anchor="end" style="font-size:15px">Carbon steel 1018</text>
<rect x="240" y="148" width="88" height="24" fill="#7d8896"/>
<text x="338.0" y="165" text-anchor="start" style="font-size:15px;font-weight:600">1x (baseline)</text>
<text x="230" y="203" text-anchor="end" style="font-size:15px">Stainless 304</text>
<rect x="240" y="186" width="44" height="24" fill="#b0590e"/>
<text x="294.0" y="203" text-anchor="start" style="font-size:15px;font-weight:600">about 0.5x</text>
<text x="230" y="241" text-anchor="end" style="font-size:15px">Titanium Ti-6Al-4V</text>
<rect x="240" y="224" width="31" height="24" fill="#b3261e"/>
<text x="280.8" y="241" text-anchor="start" style="font-size:15px;font-weight:600">about 0.3-0.4x</text>
<line x1="240" y1="24" x2="240" y2="258" stroke="#34495e" stroke-width="1.5"/>
<text x="240" y="284" text-anchor="start" class="s">Approximate material removal rate compared with carbon steel. Varies with grade, tooling and machine.</text>
</svg>
