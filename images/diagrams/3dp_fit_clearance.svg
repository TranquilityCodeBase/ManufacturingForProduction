<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="Segoe UI, Arial, sans-serif">
  <title>Clearance gap per side for printed mating parts</title>
  <!-- Housing with bore (section view) -->
  <rect x="60" y="50" width="300" height="180" fill="#cfd8e3" stroke="#34495e" stroke-width="2"/>
  <rect x="150" y="50" width="120" height="150" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <!-- Pin, smaller than the bore by the clearance gap -->
  <rect x="166" y="20" width="88" height="170" fill="#9fb4c9" stroke="#34495e" stroke-width="2"/>
  <!-- Gap dimension on the right side -->
  <line x1="254" y1="120" x2="270" y2="120" stroke="#1f6fb2" stroke-width="2"/>
  <line x1="254" y1="110" x2="254" y2="130" stroke="#1f6fb2" stroke-width="1.5"/>
  <line x1="270" y1="110" x2="270" y2="130" stroke="#1f6fb2" stroke-width="1.5"/>
  <line x1="270" y1="120" x2="390" y2="120" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="210" y="250" text-anchor="middle" font-size="13" fill="#1c2733">Section: pin in a printed bore</text>

  <!-- Gap table -->
  <text x="400" y="96" font-size="15" font-weight="700" fill="#1f6fb2">Gap per side (start here)</text>
  <g font-size="14" fill="#1c2733">
    <text x="400" y="126">FDM</text><text x="560" y="126">0.2-0.5 mm</text>
    <text x="400" y="150">SLA</text><text x="560" y="150">0.1-0.2 mm</text>
    <text x="400" y="174">SLS / MJF</text><text x="560" y="174">0.3-0.5 mm</text>
    <text x="400" y="198">Print-in-place</text><text x="560" y="198">≥ 0.5 mm</text>
  </g>
  <line x1="400" y1="106" x2="690" y2="106" stroke="#d6dde6" stroke-width="1.5"/>
  <text x="400" y="230" font-size="12" fill="#4a5868">Print a test coupon in your material to tune.</text>
</svg>
