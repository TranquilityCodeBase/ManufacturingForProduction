<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="Clearance gap per side for printed mating parts">
<title>Clearance gap per side for printed mating parts</title>
<style>
  text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2733; font-size: 14px; }
  .h { font-size: 16px; font-weight: 700; }
  .s { font-size: 13px; fill: #4a5868; }
  .lbl { fill: #1f6fb2; font-weight: 600; }
  .good { fill: #1d7a4f; font-weight: 600; }
  .warn { fill: #b0590e; font-weight: 600; }
  .bad { fill: #b3261e; font-weight: 600; }
  .muted { fill: #6b7a8c; font-size: 13px; letter-spacing: 2px; }
  .part { fill: #cfd8e3; stroke: #34495e; stroke-width: 2; }
  .part2 { fill: #9fb4c9; stroke: #34495e; stroke-width: 2; }
  .tool { fill: #f3b562; stroke: #b9772c; stroke-width: 2; }
  .flute { stroke: #b9772c; stroke-width: 1.5; }
  .holder { fill: #9aa7b4; stroke: #5d6b79; stroke-width: 2; }
  .dim { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .lead { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .sep { stroke: #d6dde6; stroke-width: 2; }
  .air { fill: #ffffff; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs>
  <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1d7a4f"/>
  </marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#b3261e"/>
  </marker>
</defs>

<rect x="60" y="50" width="300" height="180" class="part"/>
<rect x="150" y="50" width="120" height="150" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
<rect x="166" y="20" width="88" height="170" class="part2"/>
<line x1="254" y1="110" x2="254" y2="130" stroke="#1f6fb2" stroke-width="1.5"/><line x1="270" y1="110" x2="270" y2="130" stroke="#1f6fb2" stroke-width="1.5"/>
<line x1="392" y1="120" x2="264" y2="120" class="lead" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text x="210" y="250" text-anchor="middle">Section: pin in a printed bore</text>
<text x="400" y="96" text-anchor="start" class="lbl" style="font-size:15px">Gap per side (start here)</text>
<line x1="400" y1="106" x2="690" y2="106" class="sep" style="stroke-width:1.5"/>
<text x="400" y="130" text-anchor="start">FDM</text>
<text x="560" y="130" text-anchor="start">0.2-0.5 mm</text>
<text x="400" y="154" text-anchor="start">SLA</text>
<text x="560" y="154" text-anchor="start">0.1-0.2 mm</text>
<text x="400" y="178" text-anchor="start">SLS / MJF</text>
<text x="560" y="178" text-anchor="start">0.3-0.5 mm</text>
<text x="400" y="202" text-anchor="start">Print-in-place</text>
<text x="560" y="202" text-anchor="start">&#8805; 0.5 mm</text>
<text x="400" y="230" text-anchor="start" class="s">Per side. Diameter difference is twice this. Print a test coupon to tune.</text>
</svg>
