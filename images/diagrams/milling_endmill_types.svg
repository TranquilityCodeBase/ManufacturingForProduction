<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Flat, bullnose and ball end mill profiles and their uses">
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2733; font-size: 14px; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; fill: #4a5868; }
    .tool { fill: #f3b562; stroke: #b9772c; stroke-width: 2; }
    .flute { stroke: #b9772c; stroke-width: 1.5; }
    .part { fill: #cfd8e3; stroke: #34495e; stroke-width: 2; }
  </style>

  <!-- Flat end mill -->
  <g transform="translate(150,0)">
    <path d="M-25 30 V170 H25 V30 Z" class="tool"/>
    <line x1="-25" y1="120" x2="25" y2="100" class="flute"/>
    <line x1="-25" y1="145" x2="25" y2="125" class="flute"/>
    <line x1="-25" y1="168" x2="25" y2="150" class="flute"/>
    <text x="0" y="238" text-anchor="middle" class="h">Flat end mill</text>
    <text x="0" y="258" text-anchor="middle">Roughing, flat floors, walls</text>
    <text x="0" y="278" text-anchor="middle" class="s">Leaves a sharp floor-to-wall edge</text>
  </g>

  <!-- Bullnose end mill -->
  <g transform="translate(450,0)">
    <path d="M-25 30 V158 A12 12 0 0 0 -13 170 H13 A12 12 0 0 0 25 158 V30 Z" class="tool"/>
    <line x1="-25" y1="120" x2="25" y2="100" class="flute"/>
    <line x1="-25" y1="145" x2="25" y2="125" class="flute"/>
    <text x="0" y="238" text-anchor="middle" class="h">Bullnose (corner radius)</text>
    <text x="0" y="258" text-anchor="middle">Hard metals, filleted floors</text>
    <text x="0" y="278" text-anchor="middle" class="s">Floor fillet = tool corner radius</text>
  </g>

  <!-- Ball end mill -->
  <g transform="translate(750,0)">
    <path d="M-25 30 V145 A25 25 0 0 0 25 145 V30 Z" class="tool"/>
    <line x1="-25" y1="110" x2="25" y2="90" class="flute"/>
    <line x1="-25" y1="135" x2="25" y2="115" class="flute"/>
    <text x="0" y="238" text-anchor="middle" class="h">Ball end mill</text>
    <text x="0" y="258" text-anchor="middle">3D contours, fillets, edge breaks</text>
    <text x="0" y="278" text-anchor="middle" class="s">Finishing only: many slow passes</text>
  </g>
</svg>
