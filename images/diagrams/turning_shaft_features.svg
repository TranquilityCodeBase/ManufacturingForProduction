<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Turned shaft with common lathe features labelled">
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2733; font-size: 14px; }
    .lbl { fill: #1f6fb2; font-weight: 600; }
    .s { font-size: 13px; fill: #4a5868; }
    .part { fill: #cfd8e3; stroke: #34495e; stroke-width: 2; }
    .chuck { fill: #9aa7b4; stroke: #5d6b79; stroke-width: 2; }
    .lead { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
    .axis { stroke: #1f6fb2; stroke-width: 1.2; stroke-dasharray: 10 4 2 4; }
  </style>

  <!-- chuck jaws -->
  <rect x="20" y="95" width="60" height="45" class="chuck"/>
  <rect x="20" y="200" width="60" height="45" class="chuck"/>
  <text x="50" y="280" text-anchor="middle" class="s">Chuck</text>

  <!-- shaft profile: big diameter, groove, step, threaded end -->
  <path d="M80 110 H330 V125 H350 V110 H470 L480 130 H640 V145 H760 L775 158 V182 L760 195 H640 V210 H480 L470 230 H350 V215 H330 V230 H80 Z" class="part"/>
  <!-- wrench flat band -->
  <rect x="200" y="110" width="80" height="14" fill="#b8c4d2" stroke="#34495e" stroke-width="1.5"/>
  <!-- cross hole -->
  <rect x="400" y="110" width="20" height="120" fill="#ffffff" stroke="#34495e" stroke-width="1.5" stroke-dasharray="5 3"/>
  <!-- thread zig-zag -->
  <path d="M645 145 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6" fill="none" stroke="#34495e" stroke-width="1.5"/>
  <path d="M645 195 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6" fill="none" stroke="#34495e" stroke-width="1.5"/>
  <line x1="20" y1="170" x2="800" y2="170" class="axis"/>

  <!-- labels -->
  <line x1="240" y1="106" x2="240" y2="70" class="lead"/>
  <text x="240" y="62" text-anchor="middle" class="lbl">Wrench flats (live tool)</text>
  <line x1="340" y1="230" x2="300" y2="275" class="lead"/>
  <text x="290" y="292" text-anchor="middle" class="lbl">Groove</text>
  <text x="290" y="310" text-anchor="middle" class="s">min 0.047 in wide, max 0.95 in deep</text>
  <line x1="410" y1="106" x2="430" y2="70" class="lead"/>
  <text x="450" y="62" text-anchor="middle" class="lbl">Radial cross hole</text>
  <line x1="476" y1="228" x2="560" y2="275" class="lead"/>
  <text x="600" y="292" text-anchor="middle" class="lbl">Shoulder chamfer</text>
  <text x="600" y="310" text-anchor="middle" class="s">clears the tool nose radius</text>
  <line x1="700" y1="138" x2="700" y2="100" class="lead"/>
  <text x="700" y="92" text-anchor="middle" class="lbl">OD thread</text>
  <text x="700" y="74" text-anchor="middle" class="s">model the plain diameter</text>
  <line x1="772" y1="185" x2="820" y2="230" class="lead"/>
  <text x="825" y="248" text-anchor="middle" class="lbl">End chamfer</text>
</svg>
