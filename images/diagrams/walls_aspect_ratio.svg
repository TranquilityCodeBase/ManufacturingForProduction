<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Thin tall wall deflecting versus a 3 to 1 wall and a drafted or braced wall">
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2733; font-size: 14px; }
    .h { font-size: 16px; font-weight: 700; }
    .good { fill: #1d7a4f; font-weight: 600; }
    .bad { fill: #b3261e; font-weight: 600; }
    .dimt { fill: #1f6fb2; font-weight: 600; }
    .part { fill: #cfd8e3; stroke: #34495e; stroke-width: 2; }
    .tool { fill: #f3b562; stroke: #b9772c; stroke-width: 2; }
    .dim { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
    </marker>
  </defs>

  <line x1="300" y1="15" x2="300" y2="315" stroke="#d6dde6" stroke-width="2"/>
  <line x1="600" y1="15" x2="600" y2="315" stroke="#d6dde6" stroke-width="2"/>

  <!-- Panel A: thin tall wall -->
  <text x="150" y="30" text-anchor="middle" class="h">Thin and tall</text>
  <rect x="40" y="240" width="220" height="30" class="part"/>
  <rect x="140" y="60" width="14" height="180" class="part"/>
  <path d="M140 240 Q140 150 128 60 H142 Q154 150 154 240" fill="none" stroke="#b3261e" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="162" y="70" width="26" height="110" class="tool"/>
  <text x="70" y="120" class="bad">flexes</text>
  <text x="150" y="295" text-anchor="middle" class="bad">H : W over 4 : 1</text>
  <text x="150" y="314" text-anchor="middle">Chatter, ripple, can break</text>

  <!-- Panel B: 3:1 wall -->
  <g transform="translate(300,0)">
    <text x="150" y="30" text-anchor="middle" class="h">Proportioned wall</text>
    <rect x="40" y="240" width="220" height="30" class="part"/>
    <rect x="125" y="90" width="50" height="150" class="part"/>
    <line x1="110" y1="90" x2="110" y2="240" class="dim" marker-start="url(#d)" marker-end="url(#d)"/>
    <text x="96" y="170" text-anchor="end" class="dimt">H</text>
    <line x1="125" y1="78" x2="175" y2="78" class="dim" marker-start="url(#d)" marker-end="url(#d)"/>
    <text x="150" y="70" text-anchor="middle" class="dimt">W</text>
    <text x="150" y="295" text-anchor="middle" class="good">H : W about 3 : 1</text>
    <text x="150" y="314" text-anchor="middle">Rigid enough to hold tolerance</text>
  </g>

  <!-- Panel C: drafted / braced -->
  <g transform="translate(600,0)">
    <text x="150" y="30" text-anchor="middle" class="h">Tall but supported</text>
    <rect x="40" y="240" width="220" height="30" class="part"/>
    <path d="M100 240 L110 60 H124 L134 240 Z" class="part"/>
    <path d="M134 240 L134 150 L210 240 Z" class="part"/>
    <text x="214" y="200" class="dimt">gusset</text>
    <text x="40" y="140" class="dimt">1 to 3</text>
    <text x="40" y="158" class="dimt">deg draft</text>
    <text x="150" y="295" text-anchor="middle" class="good">Draft and/or bracing</text>
    <text x="150" y="314" text-anchor="middle">Stiffer, less leftover stock</text>
  </g>
</svg>
