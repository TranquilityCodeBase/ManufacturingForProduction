<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Segoe UI, Arial, sans-serif">
  <title>Overhang angle measured from the build plate</title>
  <!-- Panel titles -->
  <text x="120" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1d7a4f">60° - prints clean</text>
  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6fb2">45° - practical limit</text>
  <text x="600" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#b3261e">30° - needs support</text>
  <text x="120" y="54" text-anchor="middle" font-size="13" fill="#1c2733">no support needed</text>
  <text x="360" y="54" text-anchor="middle" font-size="13" fill="#1c2733">design default</text>
  <text x="600" y="54" text-anchor="middle" font-size="13" fill="#1c2733">supports leave marks</text>

  <!-- Build plate -->
  <rect x="10" y="230" width="700" height="10" fill="#8a97a6"/>

  <!-- Panel 1: 60 degree wall -->
  <polygon points="50,230 90,230 165,100 125,100" fill="#cfd8e3" stroke="#34495e" stroke-width="2"/>
  <path d="M130,230 A40,40 0 0 0 110,195.4" fill="none" stroke="#1f6fb2" stroke-width="2"/>
  <text x="138" y="212" font-size="14" font-weight="700" fill="#1f6fb2">60°</text>

  <!-- Panel 2: 45 degree wall -->
  <polygon points="290,230 330,230 436,124 396,124" fill="#cfd8e3" stroke="#34495e" stroke-width="2"/>
  <path d="M370,230 A40,40 0 0 0 358.3,201.7" fill="none" stroke="#1f6fb2" stroke-width="2"/>
  <text x="376" y="214" font-size="14" font-weight="700" fill="#1f6fb2">45°</text>

  <!-- Panel 3: 30 degree wall with support columns underneath -->
  <polygon points="570,230 700,155 700,230" fill="#fbe3c0"/>
  <g stroke="#b9772c" stroke-width="2">
    <line x1="585" y1="230" x2="585" y2="221.3"/>
    <line x1="600" y1="230" x2="600" y2="212.7"/>
    <line x1="615" y1="230" x2="615" y2="204"/>
    <line x1="630" y1="230" x2="630" y2="195.4"/>
    <line x1="645" y1="230" x2="645" y2="186.7"/>
    <line x1="660" y1="230" x2="660" y2="178"/>
    <line x1="675" y1="230" x2="675" y2="169.4"/>
    <line x1="690" y1="230" x2="690" y2="160.8"/>
  </g>
  <polygon points="530,230 570,230 700,155 660,155" fill="#cfd8e3" stroke="#34495e" stroke-width="2"/>
  <path d="M570,230 L700,155" stroke="#b3261e" stroke-width="3"/>
  <path d="M610,230 A40,40 0 0 0 604.6,210" fill="none" stroke="#1f6fb2" stroke-width="2"/>
  <rect x="611" y="211" width="30" height="17" fill="#ffffff"/>
  <text x="614" y="224" font-size="13" font-weight="700" fill="#1f6fb2">30°</text>

  <!-- Convention note -->
  <text x="360" y="272" text-anchor="middle" font-size="14" fill="#1c2733">Angle is measured between the down-facing surface and the build plate (horizontal).</text>
  <text x="360" y="291" text-anchor="middle" font-size="13" fill="#4a5868">Some slicers and vendors measure from vertical instead - 45° is the same either way.</text>
</svg>
