<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280" role="img" aria-label="Section view of engraved versus embossed text">
<title>Section view of engraved versus embossed text</title>
<style>
  text { font-family: "Segoe UI", Arial, sans-serif; fill: #1c2733; font-size: 14px; }
  .h { font-size: 16px; font-weight: 700; }
  .s { font-size: 13px; fill: #4a5868; }
  .lbl { fill: #1f6fb2; font-weight: 600; }
  .good { fill: #1d7a4f; font-weight: 600; }
  .warn { fill: #b0590e; font-weight: 600; }
  .bad { fill: #b3261e; font-weight: 600; }
  .muted { fill: #6b7a8c; font-size: 13px; letter-spacing: 2px; }
  .part { fill: #cfd8e3; stroke: #34495e; stroke-width: 2; }
  .part2 { fill: #9fb4c9; stroke: #34495e; stroke-width: 2; }
  .tool { fill: #f3b562; stroke: #b9772c; stroke-width: 2; }
  .flute { stroke: #b9772c; stroke-width: 1.5; }
  .holder { fill: #9aa7b4; stroke: #5d6b79; stroke-width: 2; }
  .dim { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .lead { stroke: #1f6fb2; stroke-width: 1.5; fill: none; }
  .sep { stroke: #d6dde6; stroke-width: 2; }
  .air { fill: #ffffff; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs>
  <marker id="d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1f6fb2"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#1d7a4f"/>
  </marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1 L10 5 L0 9 z" fill="#b3261e"/>
  </marker>
</defs>

<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fbe3e1"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b3261e" stroke-width="2"/></pattern></defs>
<line x1="430" y1="15" x2="430" y2="265" class="sep"/>
<text x="215" y="30" text-anchor="middle" class="h">Engraved (recessed)</text>
<path d="M40 110 H110 V132 H126 V110 H170 V132 H186 V110 H230 V132 H246 V110 H290 V132 H306 V110 H390 V200 H40 Z" class="part"/>
<line x1="118" y1="128" x2="118" y2="76" class="lead"/>
<text x="118" y="70" text-anchor="middle" class="lbl">letters cut in</text>
<text x="215" y="235" text-anchor="middle" class="good">Removes only the letters</text>
<text x="215" y="255" text-anchor="middle">Stroke and spacing at least 0.020 in (0.5 mm)</text>
<g transform="translate(430,0)">
<text x="215" y="30" text-anchor="middle" class="h">Embossed (raised)</text>
<rect x="40" y="90" width="350" height="30" fill="url(#hatch)" stroke="#b3261e" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M40 120 H110 V90 H126 V120 H170 V90 H186 V120 H230 V90 H246 V120 H290 V90 H306 V120 H390 V200 H40 Z" class="part"/>
<rect x="110" y="90" width="16" height="30" fill="#9fb4c9" stroke="#34495e" stroke-width="2"/>
<rect x="170" y="90" width="16" height="30" fill="#9fb4c9" stroke="#34495e" stroke-width="2"/>
<rect x="230" y="90" width="16" height="30" fill="#9fb4c9" stroke="#34495e" stroke-width="2"/>
<rect x="290" y="90" width="16" height="30" fill="#9fb4c9" stroke="#34495e" stroke-width="2"/>
<line x1="118" y1="88" x2="118" y2="62" class="lead"/>
<text x="118" y="56" text-anchor="middle" class="lbl">raised letters</text>
<line x1="350" y1="96" x2="372" y2="62" stroke="#b3261e" stroke-width="1.5"/>
<text x="372" y="56" text-anchor="middle" class="bad">machined away</text>
<text x="215" y="235" text-anchor="middle" class="bad">Everything around the letters is cut</text>
<text x="215" y="255" text-anchor="middle">More tool time, small cutters, higher cost</text>
</g>
</svg>
